<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <radialGradient id="glow-cyan" cx="15%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="85%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-center" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#30363d" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#bc8cff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#79c0ff" />
      <stop offset="100%" stop-color="#d2a8ff" />
    </linearGradient>

    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#8957e5" />
    </linearGradient>

    <!-- Topic Pills Gradients -->
    <linearGradient id="pill-python" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="pill-automation" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56d364" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="pill-cli" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79c0ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="pill-api" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d2a8ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="pill-devops" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa657" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#d29922" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="pill-oss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#238636" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="pill-tags" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="pill-seo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f778ba" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#bf3989" stop-opacity="0.08" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#30363d" fill-opacity="0.45" />
      <line x1="0" y1="20" x2="40" y2="20" stroke="#21262d" stroke-width="0.5" stroke-opacity="0.3" />
      <line x1="20" y1="0" x2="20" y2="40" stroke="#21262d" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="pill-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#58a6ff" flood-opacity="0.2" />
    </filter>
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#388bfd" flood-opacity="0.3" />
    </filter>

    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      }

      /* Dynamic Animations */
      @keyframes float-1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes float-2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(9px) rotate(-1.2deg); }
      }
      @keyframes float-3 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(-0.8deg); }
      }
      @keyframes float-4 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(1.4deg); }
      }

      @keyframes pulse-flow {
        0% { stroke-dashoffset: 48; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes glow-breathe {
        0%, 100% { opacity: 0.28; transform: scale(1); }
        50% { opacity: 0.52; transform: scale(1.08); }
      }

      @keyframes pulse-live {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.8); }
      }

      @keyframes cursor-blink {
        0%, 45% { opacity: 1; }
        50%, 95% { opacity: 0; }
        100% { opacity: 1; }
      }

      @keyframes border-shimmer {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }

      .floating-pill-1 { animation: float-1 4.5s ease-in-out infinite; transform-origin: center; }
      .floating-pill-2 { animation: float-2 5.2s ease-in-out infinite; transform-origin: center; }
      .floating-pill-3 { animation: float-3 4.8s ease-in-out infinite; transform-origin: center; }
      .floating-pill-4 { animation: float-4 5.6s ease-in-out infinite; transform-origin: center; }

      .flow-line {
        stroke-dasharray: 6 6;
        animation: pulse-flow 2.2s linear infinite;
      }
      .flow-line-reverse {
        stroke-dasharray: 6 6;
        animation: pulse-flow 2.2s linear infinite reverse;
      }

      .glow-aurora-1 { animation: glow-breathe 6s ease-in-out infinite; transform-origin: 200px 100px; }
      .glow-aurora-2 { animation: glow-breathe 7s ease-in-out infinite alternate; transform-origin: 1000px 300px; }

      .live-dot { animation: pulse-live 1.8s ease-in-out infinite; transform-origin: center; }
      .cli-cursor { animation: cursor-blink 1s steps(1) infinite; }
      .shimmer-border { animation: border-shimmer 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- 1. Background Base -->
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#grid-pattern)" />

  <!-- 2. Dynamic Ambient Glow Orbs (Background layer) -->
  <circle class="glow-aurora-1" cx="180" cy="120" r="280" fill="url(#glow-cyan)" />
  <circle class="glow-aurora-2" cx="1020" cy="300" r="280" fill="url(#glow-purple)" />
  <circle cx="600" cy="210" r="340" fill="url(#glow-center)" />

  <!-- 3. Animated Connection Flows (Background data pipes connecting topics to the hub) -->
  <g opacity="0.6">
    <!-- Left pipes to Center Card -->
    <path class="flow-line" d="M185 75 C210 75, 215 110, 235 120" stroke="#388bfd" stroke-width="1.5" fill="none" />
    <path class="flow-line" d="M195 165 C215 165, 215 175, 235 180" stroke="#56d364" stroke-width="1.5" fill="none" />
    <path class="flow-line" d="M180 255 C210 255, 215 240, 235 235" stroke="#79c0ff" stroke-width="1.5" fill="none" />
    <path class="flow-line" d="M190 345 C215 345, 215 300, 235 290" stroke="#bc8cff" stroke-width="1.5" fill="none" />

    <!-- Right pipes to Center Card -->
    <path class="flow-line-reverse" d="M1015 75 C990 75, 985 110, 965 120" stroke="#ffa657" stroke-width="1.5" fill="none" />
    <path class="flow-line-reverse" d="M995 165 C975 165, 975 175, 965 180" stroke="#3fb950" stroke-width="1.5" fill="none" />
    <path class="flow-line-reverse" d="M985 255 C965 255, 975 240, 965 235" stroke="#bc8cff" stroke-width="1.5" fill="none" />
    <path class="flow-line-reverse" d="M990 345 C970 345, 975 300, 965 290" stroke="#f778ba" stroke-width="1.5" fill="none" />
  </g>

  <!-- 4. Dynamic Flank Topic Pills (Floating around, safely outside center zone) -->
  <!-- LEFT FLANK PILLS -->
  <!-- Pill 1: python -->
  <g class="floating-pill-1" filter="url(#pill-glow)">
    <rect x="35" y="55" width="150" height="40" rx="20" fill="url(#pill-python)" stroke="#388bfd" stroke-width="1.2" />
    <circle cx="56" cy="75" r="5" fill="#388bfd" />
    <text class="font-mono" x="72" y="80" font-size="13" font-weight="600" fill="#79c0ff">#python</text>
  </g>

  <!-- Pill 2: automation -->
  <g class="floating-pill-2" filter="url(#pill-glow)">
    <rect x="20" y="145" width="175" height="40" rx="20" fill="url(#pill-automation)" stroke="#2ea043" stroke-width="1.2" />
    <circle cx="41" cy="165" r="5" fill="#3fb950" />
    <text class="font-mono" x="57" y="170" font-size="13" font-weight="600" fill="#7ee787">#automation</text>
  </g>

  <!-- Pill 3: cli-tool -->
  <g class="floating-pill-3" filter="url(#pill-glow)">
    <rect x="40" y="235" width="145" height="40" rx="20" fill="url(#pill-cli)" stroke="#58a6ff" stroke-width="1.2" />
    <circle cx="61" cy="255" r="5" fill="#58a6ff" />
    <text class="font-mono" x="77" y="260" font-size="13" font-weight="600" fill="#a5d6ff">#cli-tool</text>
  </g>

  <!-- Pill 4: github-api -->
  <g class="floating-pill-4" filter="url(#pill-glow)">
    <rect x="25" y="325" width="168" height="40" rx="20" fill="url(#pill-api)" stroke="#a371f7" stroke-width="1.2" />
    <circle cx="46" cy="345" r="5" fill="#bc8cff" />
    <text class="font-mono" x="62" y="350" font-size="13" font-weight="600" fill="#d2a8ff">#github-api</text>
  </g>

  <!-- RIGHT FLANK PILLS -->
  <!-- Pill 5: devops -->
  <g class="floating-pill-2" filter="url(#pill-glow)">
    <rect x="1015" y="55" width="145" height="40" rx="20" fill="url(#pill-devops)" stroke="#f0883e" stroke-width="1.2" />
    <circle cx="1036" cy="75" r="5" fill="#ffa657" />
    <text class="font-mono" x="1052" y="80" font-size="13" font-weight="600" fill="#ffc680">#devops</text>
  </g>

  <!-- Pill 6: open-source -->
  <g class="floating-pill-1" filter="url(#pill-glow)">
    <rect x="990" y="145" width="180" height="40" rx="20" fill="url(#pill-oss)" stroke="#3fb950" stroke-width="1.2" />
    <circle cx="1011" cy="165" r="5" fill="#3fb950" />
    <text class="font-mono" x="1027" y="170" font-size="13" font-weight="600" fill="#7ee787">#open-source</text>
  </g>

  <!-- Pill 7: repo-tags -->
  <g class="floating-pill-4" filter="url(#pill-glow)">
    <rect x="980" y="235" width="192" height="40" rx="20" fill="url(#pill-tags)" stroke="#8957e5" stroke-width="1.2" />
    <circle cx="1001" cy="255" r="5" fill="#bc8cff" />
    <text class="font-mono" x="1017" y="260" font-size="13" font-weight="600" fill="#d2a8ff">#repository-tags</text>
  </g>

  <!-- Pill 8: seo-boost -->
  <g class="floating-pill-3" filter="url(#pill-glow)">
    <rect x="990" y="325" width="175" height="40" rx="20" fill="url(#pill-seo)" stroke="#f778ba" stroke-width="1.2" />
    <circle cx="1011" cy="345" r="5" fill="#f778ba" />
    <text class="font-mono" x="1027" y="350" font-size="13" font-weight="600" fill="#ffb8d9">#seo-boost</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 5. FOREGROUND CONTENT: CENTER STAGE (ALWAYS ON TOP, GUARANTEED VISIBLE) -->
  <!-- ========================================================================= -->
  <g id="foreground-hero" filter="url(#card-shadow)">
    <!-- Hero Backdrop Card -->
    <rect x="235" y="35" width="730" height="350" rx="20" fill="#161b22" fill-opacity="0.96" />
    <!-- Gradient Shimmer Border -->
    <rect class="shimmer-border" x="235" y="35" width="730" height="350" rx="20" fill="none" stroke="url(#card-border)" stroke-width="1.5" />

    <!-- Top Badge / Category Chip -->
    <g transform="translate(440, 52)">
      <rect x="0" y="0" width="320" height="28" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <!-- Pulsing Live Indicator -->
      <circle class="live-dot" cx="16" cy="14" r="4.5" fill="#3fb950" />
      <text class="font-sans" x="28" y="18" font-size="11" font-weight="700" fill="#8b949e" letter-spacing="1.2">
        GITHUB REPOSITORY DISCOVERY &amp; SEO
      </text>
    </g>

    <!-- Main Title Group -->
    <g transform="translate(600, 126)">
      <!-- GitHub Topic Tag Icon -->
      <g transform="translate(-250, -32)">
        <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#icon-grad)" filter="url(#pill-glow)" />
        <!-- Topic Tag SVG Path -->
        <path d="M16 26.5 L24.5 18 H33 V26.5 L24.5 35 Z M28.5 22.5 C29.3 22.5 30 21.8 30 21 C30 20.2 29.3 19.5 28.5 19.5 C27.7 19.5 27 20.2 27 21 C27 21.8 27.7 22.5 28.5 22.5 Z" fill="#ffffff" />
        <path d="M19 19 L21.5 15 M15 23 L11 25" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
      </g>

      <!-- Main Title Text -->
      <text class="font-sans" x="-185" y="4" font-size="40" font-weight="800" fill="url(#title-grad)" filter="url(#text-glow)" letter-spacing="-0.5">
        add-github-topics
      </text>
    </g>

    <!-- Subtitle Text -->
    <text class="font-sans" x="600" y="165" text-anchor="middle" font-size="15" font-weight="500" fill="#c9d1d9">
      Automate repository tagging with a single command • Never overwrite existing topics
    </text>

    <!-- Terminal Command Snippet Box -->
    <g transform="translate(285, 192)">
      <rect x="0" y="0" width="630" height="92" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <!-- Window Controls -->
      <circle cx="20" cy="18" r="4.5" fill="#ff5f56" />
      <circle cx="36" cy="18" r="4.5" fill="#ffbd2e" />
      <circle cx="52" cy="18" r="4.5" fill="#27c93f" />
      <text class="font-mono" x="315" y="22" text-anchor="middle" font-size="11" fill="#484f58">terminal — add-github-topic</text>
      <line x1="0" y1="34" x2="630" y2="34" stroke="#21262d" stroke-width="1" />

      <!-- Command Line Content -->
      <g transform="translate(22, 64)">
        <text class="font-mono" x="0" y="0" font-size="15" font-weight="700" fill="#3fb950">$</text>
        <text class="font-mono" x="18" y="0" font-size="14" font-weight="600" fill="#79c0ff">add-github-topic</text>
        <text class="font-mono" x="156" y="0" font-size="14" font-weight="500" fill="#d2a8ff">python</text>
        <text class="font-mono" x="216" y="0" font-size="14" font-weight="500" fill="#7ee787">machine-learning</text>
        <text class="font-mono" x="360" y="0" font-size="14" font-weight="500" fill="#ffa657">devops</text>
        <!-- Blinking Prompt Cursor -->
        <rect class="cli-cursor" x="424" y="-13" width="8" height="17" rx="1" fill="#58a6ff" />
      </g>
    </g>

    <!-- Bottom Feature Chips / Highlights -->
    <g transform="translate(285, 312)">
      <!-- Chip 1: Smart Appending -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="144" height="28" rx="7" fill="#21262d" stroke="#30363d" stroke-width="0.8" />
        <text class="font-sans" x="14" y="18" font-size="11.5" font-weight="600" fill="#7ee787">✓ Smart Append</text>
      </g>
      <!-- Chip 2: Zero Config -->
      <g transform="translate(158, 0)">
        <rect x="0" y="0" width="144" height="28" rx="7" fill="#21262d" stroke="#30363d" stroke-width="0.8" />
        <text class="font-sans" x="14" y="18" font-size="11.5" font-weight="600" fill="#79c0ff">✓ Zero-Config Git</text>
      </g>
      <!-- Chip 3: Secure Auth -->
      <g transform="translate(316, 0)">
        <rect x="0" y="0" width="154" height="28" rx="7" fill="#21262d" stroke="#30363d" stroke-width="0.8" />
        <text class="font-sans" x="14" y="18" font-size="11.5" font-weight="600" fill="#d2a8ff">✓ gh CLI &amp; .env PAT</text>
      </g>
      <!-- Chip 4: PyPI & Cross-Platform -->
      <g transform="translate(484, 0)">
        <rect x="0" y="0" width="146" height="28" rx="7" fill="#21262d" stroke="#30363d" stroke-width="0.8" />
        <text class="font-sans" x="14" y="18" font-size="11.5" font-weight="600" fill="#ffa657">✓ pip installable</text>
      </g>
    </g>
  </g>
</svg>